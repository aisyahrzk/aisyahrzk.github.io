# Site settings
title: Aisyah Razak
description: Personal blog
baseurl: "" # Leave empty for GitHub Pages
url: "https://aisyahrzk.github.io" # Your GitHub Pages URL

# Build settings
markdown: kramdown
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Just the Docs settings
# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "//github.com/aisyahrzk/aisyahrzk.github.io"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Heading anchor links
heading_anchors: true

# Color scheme (currently only "dark" or "light")
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 5
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Footer content
footer_content: "Copyright &copy; 2025 Aisyah Razak."

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md

# Post settings
excerpt_separator: <!--more-->

# Navigation
nav:
  - title: Home
    url: /
  - title: About
    url: /about

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

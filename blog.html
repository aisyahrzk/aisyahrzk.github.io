---
layout: default
title: Blog
permalink: /blog/
---
<h1 class="page-title">Blog</h1>
{% if site.posts.size > 0 %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="post-date">{{ post.date | date: "%-d %b %Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Nothing here yet.</p>
{% endif %}
